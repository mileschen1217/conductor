# Run-context size budget — the single tracked home of the baseline and of
# every recorded exception to it. Measured set = scripts/run-obeyed.manifest, verbatim.
# Gate = scripts/check-run-context-size.sh.
#
# WHY A METER AND NOT A RULE. The paired-deletion budget existed as prose
# through the epic that deleted five subsystems, and L1 came out of it +43 lines
# NET — its largest single growth landing on the commit that REMOVED a trigger,
# because the reasons were kept in the file being cut from. A rule with no meter
# is not a rule. This file is the meter.
#
# WHAT THE GATE DOES. Growth over `baseline` fails unless the commits since this
# file last changed carry the pairing token. Reduction always passes; update
# `baseline` in the same commit to bank it. A member that is missing or
# unreadable fails too, and is NEVER scored as zero characters — that would make
# deleting a run-obeyed file look like a free reduction, which is the gate's own
# failure mode inverted.
#
# THE PAIRING TOKEN, in a commit message, one line, exact form:
#     context-budget: +<added> -<deleted> <what was deleted>
# It is not tamper-proof: the commit that grows a file also records its own
# pairing. That limitation is stated, not patched with a third checker.
#
# A NET INCREASE WITH NOTHING TO DELETE is legal ONLY as a spec-level decision
# recorded here as a `decision:` line — the same convention check-neutrality.sh
# already uses for its banned-term list.

baseline: 135050

